spring.application.name=simple-demo

# MCP server autoconfig only when simple-demo.mcp-server.enabled=true (see application-mcp-server.properties)
spring.autoconfigure.exclude=com.embabel.agent.autoconfigure.mcpserver.AgentMcpServerAutoConfiguration
embabel.agent.application.name=simple-demo

# Ollama (defaults match Embabel agent-application.properties)
spring.ai.ollama.base-url=http://localhost:11434

# Use your local model tag exactly as Ollama reports it
embabel.models.default-llm=gemma4:e4b

# Embedding model for Lucene vector RAG (tutorial 19)
embabel.models.default-embedding-model=nomic-embed-text

# Longer timeouts for local inference
embabel.agent.platform.http-client.read-timeout=10m
embabel.agent.platform.http-client.connect-timeout=1m

# Git repo to inspect (defaults to the process working directory)
simple-demo.git.work-tree=.

# Lucene RAG index (tutorial 17); set enabled=false in tests
simple-demo.rag.enabled=true
simple-demo.rag.index-path=${user.home}/.simple-demo/lucene-index
simple-demo.rag.sources=docs/COMMIT_CONVENTIONS.md,TUTORIAL.md,rag-sources/past-commits.sample.txt
simple-demo.rag.max-chunk-size=800
simple-demo.rag.overlap-size=100
simple-demo.rag.retrieval-top-k=3

# Vector memory for similar past commits (tutorial 20)
simple-demo.vector-memory.enabled=true
simple-demo.vector-memory.recall-top-k=3

# Spring AI Ollama embeddings (same model as embabel.models.default-embedding-model)
spring.ai.ollama.embedding.options.model=nomic-embed-text
