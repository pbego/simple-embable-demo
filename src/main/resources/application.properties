spring.application.name=simple-demo
embabel.agent.application.name=simple-demo

# Ollama (defaults match Embabel agent-application.properties)
spring.ai.ollama.base-url=http://localhost:11434

# Use your local model tag exactly as Ollama reports it
embabel.models.default-llm=gemma4:e4b

# Longer timeouts for local inference
embabel.agent.platform.http-client.read-timeout=10m
embabel.agent.platform.http-client.connect-timeout=1m

# Git repo to inspect (defaults to the process working directory)
simple-demo.git.work-tree=.
