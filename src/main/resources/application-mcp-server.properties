# Profile: mcp-server — expose agents as MCP over SSE (tutorial 22)
spring.config.activate.on-profile=mcp-server

simple-demo.mcp-server.enabled=true
server.port=8081
spring.main.web-application-type=servlet

spring.ai.mcp.server.type=SYNC

# Shell is secondary when running as MCP server
embabel.agent.shell.interactive.enabled=false
